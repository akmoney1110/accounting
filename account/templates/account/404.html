<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full text-center">
        <!-- Visual Icon -->
        <div class="w-20 h-20 bg-amber-50 rounded-3xl border border-amber-200/60 mx-auto flex items-center justify-center text-amber-600 mb-6 shadow-sm">
            <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
        </div>

        <!-- Text Content -->
        <h1 class="text-6xl font-extrabold text-slate-900 tracking-tight font-mono">404</h1>
        <h2 class="mt-2 text-2xl font-bold text-slate-800">Page not found</h2>
        <p class="mt-2 text-sm text-slate-500">
            Sorry, the page you are looking for doesn't exist, was removed, or you don't have permission to view it.
        </p>

        <!-- Action Buttons -->
        <div class="mt-8 flex items-center justify-center gap-3">
            <button onclick="history.back()" class="inline-flex items-center gap-2 px-4 py-2.5 text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Go Back
            </button>

            <a href="/" class="inline-flex items-center gap-2 px-4 py-2.5 text-xs font-semibold text-white bg-slate-800 rounded-xl hover:bg-slate-900 transition-colors shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Home
            </a>
        </div>
    </div>
</body>
</html>
